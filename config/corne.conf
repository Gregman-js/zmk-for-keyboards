# --------------------------------------------------
# Zasilanie i uśpienie (Deep Sleep) - oszczędzanie baterii
# --------------------------------------------------
CONFIG_ZMK_SLEEP=y
# Czas bezczynności przed stanem czuwania (30 sekund)
CONFIG_ZMK_IDLE_TIMEOUT=30000
# Czas bezczynności przed głębokim uśpieniem (15 minut)
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# Raportowanie stanu baterii w sekundach (co 10 minut = 600 s)
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=600
CONFIG_BT_GATT_ENFORCE_SUBSCRIPTION=n

# Pobieranie i przekazywanie poziomu baterii z prawej połówki
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

# --------------------------------------------------
# Bluetooth
# --------------------------------------------------
# Zwiększona moc nadawania BLE (+8 dBm) dla stabilnego połączenia bezprzewodowego
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
CONFIG_ZMK_KEYBOARD_NAME="Corne"

# --------------------------------------------------
# Debounce (odporność na drgania styków)
# --------------------------------------------------
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=5
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=5

# --------------------------------------------------
# Wyłączenie ekranu (brak OLED)
# --------------------------------------------------
CONFIG_ZMK_DISPLAY=n

# --------------------------------------------------
# Wyłączenie RGB (brak wlutowanych diod LED)
# --------------------------------------------------
CONFIG_ZMK_RGB_UNDERGLOW=n
CONFIG_WS2812_STRIP=n

# --------------------------------------------------
# ZMK Studio (konfiguracja klawiszy przez przeglądarkę)
# --------------------------------------------------
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n
CONFIG_ZMK_STUDIO_LOCK_ON_DISCONNECT=n

